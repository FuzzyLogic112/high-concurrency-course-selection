server:
  port: 8080
  tomcat:
    threads:
      # 默认 200。选课峰值时每个请求都要等数据库往返，
      # 线程数太少会让大量请求排在容器外面而不是排在业务里
      max: 400
      min-spare: 50
    # 默认 8192，够用；显式写出来是为了论文里能说清承载上限从哪来
    max-connections: 10000
    # 默认只有 100。这是操作系统层面的连接接受队列（backlog），
    # 3000 并发瞬间涌入时它会先被打爆，客户端直接收到 ConnectException——
    # 表现为「请求还没进应用就失败了」，很容易被误判成应用扛不住
    accept-count: 3000
    connection-timeout: 20s

spring:
  application:
    name: course-selection
  profiles:
    # dev  = H2 内存库 + 进程内队列，免装 MySQL/RabbitMQ 就能跑通全链路
    # prod = MySQL + RabbitMQ，论文正式压测用这个
    active: ${APP_PROFILE:dev}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: null

app:
  jwt:
    secret: ${JWT_SECRET:please-change-me-to-a-random-string-at-least-32-chars}
    expire-minutes: 120
  # 名额扣减策略，第 6.3 节四方案对比实验就靠切这一项，业务代码完全不动
  # direct / pessimistic / optimistic / redis_mq
  deduct-strategy: ${DEDUCT_STRATEGY:redis_mq}
  rate-limit:
    enabled: true
    qps: ${RATE_LIMIT_QPS:2000}
    burst: 200
  reconcile:
    # 本地消息表重投间隔与对账间隔（毫秒）
    retry-interval-ms: 5000
    check-interval-ms: 30000

logging:
  level:
    com.ncuky.cs: info
